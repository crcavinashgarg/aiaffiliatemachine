<meta charset="utf-8">
<title>AI Affiliate Machine — System (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C0A22;--gold:#F5B301;--gold2:#FFD34E;--ink:#EDEAFF;--mut:#9c97cf;--green:#4fe0a0;--red:#ff5566}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#1a1348,#0d0930 55%,#07061a);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;padding:14px 12px 12px}
.top{display:flex;align-items:center;gap:7px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(11px,3.4vw,14px);color:#fff;flex:0 0 auto}
.top i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:beat 1.9s infinite}.top b{color:var(--gold)}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.5}}
.hd{margin-top:9px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(17px,5.2vw,24px);line-height:1.12;color:#fff;flex:0 0 auto;min-height:2.3em;transition:.4s}
.hd .g{color:var(--gold)}.hd .r{color:#ff7d8b}
.body{position:relative;flex:1 1 auto;margin-top:10px;min-height:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .5s;display:flex;flex-direction:column}
.scene.on{opacity:1}
/* PROBLEM */
.prob{gap:10px;justify-content:center}
.pain{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#26142a,#1a0e1e);
  border:1.4px solid rgba(255,85,102,.5);border-radius:13px;padding:12px 14px;box-shadow:0 8px 22px rgba(0,0,0,.4);
  opacity:0;transform:translateY(12px);transition:.45s cubic-bezier(.2,.8,.2,1)}
.prob.on .pain{opacity:1;transform:none}
.pain:nth-child(1){transition-delay:.05s}.pain:nth-child(2){transition-delay:.2s}.pain:nth-child(3){transition-delay:.35s}.pain:nth-child(4){transition-delay:.5s}.pain:nth-child(5){transition-delay:.65s}
.pain .x{width:30px;height:30px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}
.pain .l{font-family:'Plus Jakarta Sans';font-weight:700;font-size:clamp(14px,4.2vw,17px);color:#fff}
.pain .s{font-size:clamp(11px,3.2vw,13px);color:#d59aa2;font-weight:600}
/* SYSTEM */
.sys{gap:10px}
.corebar{display:flex;align-items:center;gap:11px;background:radial-gradient(120px 60px at 20% 30%,rgba(245,179,1,.3),transparent 70%),linear-gradient(180deg,#281d58,#180f42);
  border:1.5px solid rgba(245,179,1,.55);border-radius:14px;padding:12px 14px;flex:0 0 auto;box-shadow:0 0 40px rgba(245,179,1,.16)}
.corebar .gear{width:30px;height:30px;color:var(--gold2);animation:spin 5s linear infinite;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(245,179,1,.5))}
@keyframes spin{to{transform:rotate(360deg)}}
.corebar .ct{font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(14px,4.2vw,17px);color:#fff}.corebar .ct span{color:var(--gold)}
.corebar .cs{font-size:clamp(10px,3vw,12px);color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.feed{flex:1 1 auto;overflow:hidden;display:flex;flex-direction:column;gap:8px;mask:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent)}
.lbl{font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(9px,2.8vw,11px);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:2px 2px 0;opacity:0;transform:translateY(8px);transition:.4s}
.lbl.gr{color:var(--green)}.lbl.go{color:var(--gold2)}
.row{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#1b1547,#150f3a);border:1.3px solid rgba(148,143,196,.26);
  border-radius:12px;padding:10px 13px;flex:0 0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);transition:.4s cubic-bezier(.2,.8,.2,1)}
.lbl.show,.row.show{opacity:1;transform:none}
.row .ico{width:28px;height:28px;border-radius:8px;background:#0c0a24;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.row .ico svg{width:19px;height:19px;display:block}
.row .l{font-family:'Plus Jakarta Sans';font-weight:700;font-size:clamp(13px,4vw,16px);color:#fff;flex:1}
.row .stamp{font-size:clamp(8px,2.6vw,10px);font-weight:800;letter-spacing:.04em;color:#04140b;background:var(--green);padding:3px 8px;border-radius:6px;flex:0 0 auto}
.row .stamp.gold{background:var(--gold);color:#231300}
/* FREEDOM */
.free{align-items:center;justify-content:flex-start;gap:12px;padding-top:6px}
.fstars{position:absolute;inset:0;pointer-events:none}
.fstars span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.85}}
.moon{position:absolute;right:6px;top:0;width:40px;height:40px;border-radius:50%;box-shadow:inset -14px -4px 0 0 var(--gold2),0 0 30px rgba(255,211,78,.25);transform:rotate(-18deg)}
.clock{text-align:center;margin-top:6px}
.clock .t{font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(44px,15vw,64px);color:#fff;line-height:1}
.clock .t span{font-size:.4em;color:var(--gold2);margin-left:6px}
.clock .sub{margin-top:8px;font-size:clamp(12px,3.6vw,15px);color:#cbc6f0;font-weight:600;padding:0 8px}.clock .sub b{color:var(--gold2)}
.ftoast{display:flex;align-items:center;gap:9px;width:86%;background:rgba(79,224,160,.14);border:1px solid var(--green);border-radius:11px;padding:9px 13px;font-weight:700;font-size:clamp(13px,3.8vw,15px);color:#fff;opacity:0;transform:translateY(10px);transition:.45s}
.ftoast.on{opacity:1;transform:none}.ftoast b{color:var(--gold2);margin-left:auto}
.ftoast .ico{width:22px;height:22px;border-radius:6px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center}.ftoast .ico svg{width:16px;height:16px}
.badge{margin-top:4px;text-align:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:clamp(13px,3.9vw,16px);color:#fff;opacity:0;transition:.5s}
.badge.on{opacity:1}.badge .g{color:var(--gold)}
.cap{flex:0 0 auto;margin-top:8px;text-align:center;font-size:clamp(12px,3.5vw,15px);color:#cbc6f0;font-weight:600;min-height:2.6em}
.cap b{color:#fff}.cap .g{color:var(--gold2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app">
  <div class="top"><i></i>The&nbsp;<b>AI&nbsp;Affiliate&nbsp;Machine</b></div>
  <div class="hd" id="hd"></div>
  <div class="body">
    <div class="scene prob" id="scProb">
      <div class="pain" id="pa1"></div><div class="pain" id="pa2"></div><div class="pain" id="pa3"></div>
      <div class="pain" id="pa4"></div><div class="pain" id="pa5"></div>
    </div>
    <div class="scene sys" id="scSys">
      <div class="corebar">
        <svg class="gear" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 6a2 2 0 110-4 2 2 0 010 4z"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-1.7-1l-.4-2.5H10.9l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.4-1-2 3.4 2 1.6a7.9 7.9 0 000 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 001.7 1l.4 2.5h4.2l.4-2.5a7.6 7.6 0 001.7-1l2.4 1 2-3.4-2-1.6zM12 18.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13z"/></svg>
        <div><div class="ct">AI Affiliate <span>Machine</span></div><div class="cs" id="cst">Building everything…</div></div>
      </div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="scene free" id="scFree">
      <div class="fstars"><span style="left:14%;top:8%"></span><span style="left:30%;top:18%"></span><span style="left:70%;top:12%"></span><span style="left:84%;top:26%"></span><span style="left:22%;top:40%"></span><span style="left:78%;top:46%"></span></div>
      <div class="moon"></div>
      <div class="clock"><div class="t">3:14<span>AM</span></div><div class="sub">You’re asleep — the machine is <b>still selling.</b></div></div>
      <div class="ftoast" id="ft1"><span class="ico" id="ft_yt"></span>New sale <b>✓</b></div>
      <div class="ftoast" id="ft2"><span class="ico" id="ft_ig"></span>New sale <b>✓</b></div>
      <div class="ftoast" id="ft3"><span class="ico" id="ft_g"></span>New commission <b>✓</b></div>
      <div class="badge" id="bd">No team · No code · <span class="g">it runs 24/7</span></div>
    </div>
  </div>
  <div class="cap" id="cap"></div>
</div>

<script>
const ICO={
  yt:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#FF0000"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>',
  ig:'<svg viewBox="0 0 24 24"><defs><linearGradient id="ig1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".5" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#ig1)"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17" cy="7" r="1.3" fill="#fff"/></svg>',
  fb:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#1877F2"/><path d="M13.5 21v-7h2.3l.4-2.7h-2.7V9.5c0-.8.2-1.3 1.4-1.3h1.4V5.7c-.7-.1-1.5-.2-2.3-.2-2.3 0-3.8 1.4-3.8 3.9v2.2H7.7V14h2.6v7z" fill="#fff"/></svg>',
  g:'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.6-.1-1.2-.2-1.8H12v3.6h5.4a4.6 4.6 0 01-2 3v2.4h3.2c1.9-1.7 3-4.3 3-7.2z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.4c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.7-5.6-4.1H3.1v2.5A10 10 0 0012 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.5H3.1a10 10 0 000 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 003.1 7.5L6.4 10c.8-2.4 3-4 5.6-4z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="#4fe0a0" stroke-width="2" stroke-linecap="round"><path d="M9 12h6M8.5 8.5H7a3.5 3.5 0 100 7h1.5M15.5 8.5H17a3.5 3.5 0 010 7h-1.5"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="#4fe0a0" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  blog:'<svg viewBox="0 0 24 24" fill="none" stroke="#4fe0a0" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD34E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>',
  rank:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD34E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M4 19h16"/></svg>',
  page:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD34E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9h16M8 13h6M8 16h4"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD34E" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFD34E" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="#FFD34E"/></svg>'
};
const $=id=>document.getElementById(id);
$('ft_yt').innerHTML=ICO.yt;$('ft_ig').innerHTML=ICO.ig;$('ft_g').innerHTML=ICO.g;

const AUD={
  affiliate:{hd:'Every affiliate knows <span class="r">this pain.</span>',capIn:'Banned. Dead creatives. Everything by hand — again.',
    pains:[['Account BANNED','a week of income — gone'],['Creative burned out','need 10 more, today'],['Funnels built by hand','v1… v2… v3…'],['Waiting: product approval','emails, back &amp; forth'],['Organic? Months of work','ranking, backlinks…']]},
  dropshipper:{hd:'Every dropshipper knows <span class="r">this grind.</span>',capIn:'No winner. Bans. Dead ads. Margins gone.',
    pains:[['No winning product','testing &amp; burning cash'],['Account BANNED','store income — gone'],['Creatives stop converting','CTR dying daily'],['Margins eaten alive','ad costs &gt; profit'],['Supplier chaos','delays, refunds, stress']]},
  professional:{hd:'Why most professionals <span class="r">never start.</span>',capIn:'No time. No tech skills. No idea where to begin.',
    pains:[['No time after 9-to-5','drained by evening'],['No technical skills','“I’m not a marketer”'],['Don’t know where to start','too many gurus'],['Scared of wasting money','burned before'],['Too much to manage alone','no team, no help']]},
  passive:{hd:'Most “passive income” <span class="r">isn’t passive.</span>',capIn:'Money idle. Time-for-money. Hustles that never stop.',
    pains:[['Money sitting idle','doing nothing'],['Trading time for money','no hours = no pay'],['“Hustles” that never stop','it’s a second job'],['No system that runs itself','you are the system'],['Starting from zero, alone','no roadmap']]}
};
const A=AUD[new URLSearchParams(location.search).get('a')]||AUD.affiliate;
A.pains.forEach((p,i)=>{$('pa'+(i+1)).innerHTML='<span class="x">✕</span><div><div class="l">'+p[0]+'</div><div class="s">'+p[1]+'</div></div>';});

const FEED=[
 {lane:'Organic · SEO',cls:'gr'},
 {ic:'rank',l:'Website ranked',st:'#1 ↑',gold:1},{ic:'link',l:'Backlinks',st:'BUILT'},
 {ic:'globe',l:'Social links',st:'LIVE'},{ic:'blog',l:'Blog posts',st:'PUBLISHED'},
 {lane:'Research · Setup',cls:'go'},
 {ic:'box',l:'Winning product',st:'FOUND',gold:1},{ic:'target',l:'Best audience',st:'TARGETED',gold:1},
 {ic:'mail',l:'Approval email',st:'SENT',gold:1},{ic:'mail',l:'Email marketing',st:'SENDING',gold:1},
 {lane:'Paid · Social',cls:''},
 {ic:'yt',l:'YouTube video',st:'PUBLISHED'},{ic:'ig',l:'Instagram reel',st:'PUBLISHED'},
 {ic:'fb',l:'Facebook · LinkedIn',st:'POSTED'},{ic:'page',l:'Landing page + ads',st:'LIVE',gold:1}
];
function on(id){$(id).classList.add('on');}function off(id){$(id).classList.remove('on');}
function cap(h){$('cap').innerHTML=h;}function hd(h){$('hd').innerHTML=h;}
const feed=$('feed');
function addFeed(it){
  const el=document.createElement('div');
  if(it.lane){el.className='lbl '+it.cls;el.textContent=it.lane;}
  else{el.className='row';el.innerHTML='<span class="ico">'+ICO[it.ic]+'</span><span class="l">'+it.l+'</span><span class="stamp'+(it.gold?' gold':'')+'">'+it.st+'</span>';}
  feed.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add('show');feed.scrollTop=feed.scrollHeight;});
  // keep feed from overflowing: cap visible items
  while(feed.children.length>7){feed.removeChild(feed.firstChild);}
}
function run(){
  ['scProb','scSys','scFree'].forEach(off);hd('');cap('');feed.innerHTML='';
  ['ft1','ft2','ft3','bd'].forEach(off);$('cst').textContent='Building everything…';
  const S=[];
  S.push({d:150,fn:()=>{on('scProb');hd(A.hd);cap(A.capIn);}});
  S.push({d:3400,fn:()=>{off('scProb');}});
  S.push({d:500,fn:()=>{on('scSys');hd('One system does <span class="g">all of it.</span>');cap('One command in — it builds everything.');}});
  FEED.forEach((it,i)=>{S.push({d:i===0?500:520,fn:()=>addFeed(it)});});
  S.push({d:300,fn:()=>{$('cst').textContent='Optimising 24/7';cap('Organic + paid — <span class="g">built, published, optimised.</span>');}});
  S.push({d:1700,fn:()=>{}});
  S.push({d:500,fn:()=>{off('scSys');on('scFree');hd('You sleep. <span class="g">It keeps selling.</span>');cap('');}});
  S.push({d:600,fn:()=>on('ft1')});S.push({d:650,fn:()=>on('ft2')});S.push({d:650,fn:()=>on('ft3')});
  S.push({d:500,fn:()=>on('bd')});
  S.push({d:2400,fn:()=>{}});
  S.push({d:500,fn:()=>{off('scFree');hd('');off('bd');}});
  const SP=1.1;let t=0;S.forEach(s=>{t+=s.d*SP;setTimeout(s.fn,t);});
  setTimeout(run,t+400);
}
run();
</script>
